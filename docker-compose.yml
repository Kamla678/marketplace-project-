version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: src/Marketplace.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=MarketplaceDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      - JwtSettings__SecretKey=${JWT_SECRET}
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
